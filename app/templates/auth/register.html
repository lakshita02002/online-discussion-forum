{% extends "base.html" %}
{% block title %}Create Account{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-card__header">
      <h1 class="auth-card__title">Create an account</h1>
      <p class="auth-card__sub">Start discussing in seconds</p>
    </div>

    <form class="form" method="post" action="{{ url_for('auth.register') }}" novalidate>
      <div class="form__group">
        <label class="form__label" for="username">Username</label>
        <input
          class="form__input"
          type="text"
          id="username"
          name="username"
          value="{{ username | default('') }}"
          autocomplete="username"
          autofocus
          required
          minlength="3"
          maxlength="30"
          pattern="[A-Za-z0-9_]+"
          placeholder="cool_username"
        />
        <small class="form__hint">3–30 characters, letters, digits and underscores only.</small>
      </div>

      <div class="form__group">
        <label class="form__label" for="email">Email Address</label>
        <input
          class="form__input"
          type="email"
          id="email"
          name="email"
          value="{{ email | default('') }}"
          autocomplete="email"
          required
          placeholder="you@example.com"
        />
      </div>

      <div class="form__group">
        <label class="form__label" for="password">Password</label>
        <div class="form__input-wrap">
          <input
            class="form__input"
            type="password"
            id="password"
            name="password"
            autocomplete="new-password"
            required
            minlength="8"
            placeholder="Min. 8 characters"
          />
          <button type="button" class="form__toggle-pw" aria-label="Toggle password visibility">
            &#128065;
          </button>
        </div>
        <small class="form__hint">At least 8 characters.</small>
      </div>

      <div class="form__group">
        <label class="form__label" for="confirm_password">Confirm Password</label>
        <div class="form__input-wrap">
          <input
            class="form__input"
            type="password"
            id="confirm_password"
            name="confirm_password"
            autocomplete="new-password"
            required
            placeholder="••••••••"
          />
          <button type="button" class="form__toggle-pw" aria-label="Toggle password visibility">
            &#128065;
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn--primary btn--full">Create Account</button>
    </form>

    <p class="auth-card__footer">
      Already have an account?
      <a href="{{ url_for('auth.login') }}" class="link">Log in</a>
    </p>
  </div>
</div>
{% endblock %}
