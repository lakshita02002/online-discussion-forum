{% extends "base.html" %}
{% block title %}Log In{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-card__header">
      <h1 class="auth-card__title">Welcome back</h1>
      <p class="auth-card__sub">Sign in to join the discussion</p>
    </div>

    <form class="form" method="post" action="{{ url_for('auth.login') }}" novalidate>
      <input type="hidden" name="next" value="{{ next | default('') }}" />
      <div class="form__group">
        <label class="form__label" for="identifier">Username or Email</label>
        <input
          class="form__input"
          type="text"
          id="identifier"
          name="identifier"
          value="{{ identifier | default('') }}"
          autocomplete="username"
          autofocus
          required
          placeholder="you@example.com"
        />
      </div>

      <div class="form__group">
        <label class="form__label" for="password">Password</label>
        <div class="form__input-wrap">
          <input
            class="form__input"
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
            placeholder="••••••••"
          />
          <button type="button" class="form__toggle-pw" aria-label="Toggle password visibility">
            &#128065;
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn--primary btn--full">Log In</button>
    </form>

    <p class="auth-card__footer">
      Don't have an account?
      <a href="{{ url_for('auth.register') }}" class="link">Join Nexus Forum</a>
    </p>
  </div>
</div>
{% endblock %}
